version: '3.8'

services:
  # PostgreSQL 14 - Primary database
  postgres:
    image: postgres:14-alpine
    container_name: seguros_api_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password  # Change in production!
      POSTGRES_DB: seguros_api
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - seguros_network

  # Redis 7 - Caching layer
  redis:
    image: redis:7-alpine
    container_name: seguros_api_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "PING"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - seguros_network

  # FastAPI Application
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: seguros_api_app
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/seguros_api
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: your-super-secret-jwt-key-change-in-production-min-32-chars
      ENVIRONMENT: development
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - seguros_network

networks:
  seguros_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
